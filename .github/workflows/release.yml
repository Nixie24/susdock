name: Release

# 由 check-update.yml 判定需要发布后触发，也可手动运行
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        env:
          # shellcheck 的 npm 包在 postinstall 下载二进制，带 token 才不会被匿名限流
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm --filter webui exec tsc --noEmit

      - name: test
        run: pnpm test

      - name: version
        id: version
        run: |
          read -r version code < <(node scripts/version.ts)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "versionCode=$code" >>"$GITHUB_OUTPUT"
          echo "tag=v${version}-${code}" >>"$GITHUB_OUTPUT"

      - name: check release
        id: tagcheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::Release ${{ steps.version.outputs.tag }} already exists, skipping"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: build
        if: steps.tagcheck.outputs.exists == 'false'
        run: pnpm build

      - name: pack
        if: steps.tagcheck.outputs.exists == 'false'
        run: pnpm run pack

      - name: publish
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip
