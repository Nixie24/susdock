name: CI

# 只在 PR 上运行，push 不重复检查；main 交给 check-update，update 由 publish 自动生成
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 与 .githooks/pre-commit 一致：eslint（含 shfmt/shellcheck），
  # 外加 release 也会跑的 typecheck 和测试
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        env:
          # shellcheck 的 npm 包在 postinstall 下载二进制，带 token 才不会被匿名限流
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm --filter webui exec tsc --noEmit

      - name: test
        run: pnpm test

  # 与 .githooks/commit-msg 一致：检查提交信息格式
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        env:
          # shellcheck 的 npm 包在 postinstall 下载二进制，带 token 才不会被匿名限流
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: lint pull request commits
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitfmt --from "$FROM" --to "$TO"
